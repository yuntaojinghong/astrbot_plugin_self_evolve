name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验版本号一致性（tag / metadata.yaml / main.py / __init__.py）
        run: |
          python - <<'PY'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          def grab(path, pattern):
              m = re.search(pattern, open(path, encoding="utf-8").read(), re.M)
              return m.group(1) if m else None
          got = {
              "metadata.yaml": grab("metadata.yaml", r"^version:\s*(\S+)\s*$"),
              "main.py": grab("main.py", r'^__version__\s*=\s*"([^"]+)"'),
              "__init__.py": grab("__init__.py", r'^__version__\s*=\s*"([^"]+)"'),
          }
          bad = {k: v for k, v in got.items() if v != tag}
          if bad:
              print(f"版本号不一致：tag=v{tag}，{bad}")
              sys.exit(1)
          print(f"版本号一致：v{tag}")
          PY

      - name: 发布前回归测试
        run: python -X utf8 tests/test_logic.py

      - name: 市场规范检查（logger 只能来自 astrbot.api）
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              if "tests" in p.parts:
                  continue
              src = p.read_text(encoding="utf-8")
              if re.search(r"^\s*import logging\s*$", src, re.M) or "logging.getLogger" in src:
                  bad.append(str(p))
          print("违规文件:", bad) if bad else print("OK: 未发现标准库 logging 用法")
          sys.exit(1 if bad else 0)
          PY

      - name: 构建分发压缩包
        run: python -X utf8 scripts/build_release.py

      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          # 用仓库主人的 PAT 创建 release，发布者即显示为仓库主人本人。
          # 不传时 action 回落到内置 GITHUB_TOKEN，它属于 github-actions[bot]，
          # release 页面就会显示成机器人发布的。
          # secret 缺失时自动回退到 GITHUB_TOKEN，workflow 仍然可用。
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            dist/astrbot_plugin_self_evolve.zip
            dist/astrbot_plugin_self_evolve.tar.gz
          generate_release_notes: true
          draft: false
