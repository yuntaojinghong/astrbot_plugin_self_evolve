# 本仓库的测试是**独立脚本**，不是 pytest 用例。
#
# tests/test_logic.py 与 tests/test_settings.py 都设计成
# `python tests/xxx.py` 直接运行：它们自己往 sys.modules 里塞假的 astrbot
# 模块以便离线跑，还用大量 print 输出分段结果。CI 也是这么调的
# （见 .github/workflows/ci.yml：python -X utf8 tests/test_logic.py）。
#
# 直接 `pytest tests` 会出问题：
#   · test_logic.py 里的 test_* 是 async 函数，没有异步插件，pytest 只会
#     报 "async def functions are not natively supported" —— 21 个失败，
#     看着像代码坏了，其实只是跑法不对
#   · 两个文件都改 sys.modules，同进程跑会互相覆盖对方的桩
#
# 所以这里把 tests/ 从 pytest 的收集范围里排除，让 `pytest` 干净通过，
# 真正的测试请用 scripts/run_tests.sh（或逐个 python tests/xxx.py）。
[pytest]
# 脚本测试不在收集范围内；真正给 pytest 跑的是 tests/test_pytest_entry.py
# 与 test_settings.py 里的 test_settings_end_to_end。
testpaths = .
norecursedirs = .git .github node_modules dist build __pycache__
python_files = test_pytest_entry.py test_settings.py
